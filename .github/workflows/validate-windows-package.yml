name: Validate Release Packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "包含候选 ZIP 的草稿或正式 Release"
        required: true
        type: string
      package_sha256:
        description: "候选 Windows ZIP 的 SHA256"
        required: true
        type: string
      source_commit:
        description: "浏览器 SourceStamp 对应的源提交"
        required: true
        type: string
      build_id:
        description: "浏览器 BuildID"
        required: true
        type: string
      package_checksums:
        description: "Optional JSON mapping of candidate filenames to SHA256 for the multi-platform native matrix"
        required: false
        type: string
      mcp_commit:
        description: "Pinned frx-director-mcp revision for native fingerprint transport tests"
        required: false
        type: string

permissions:
  # GitHub only exposes draft releases to identities with push access.
  contents: write

jobs:
  native-fingerprint:
    if: ${{ inputs.package_checksums != '' && inputs.mcp_commit != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x86_64
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PACKAGE_TARGET: ${{ matrix.target }}
      PACKAGE_CHECKSUMS: ${{ inputs.package_checksums }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_BUILD_ID: ${{ inputs.build_id }}
      MOZ_HEADLESS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          # Run current validation helpers; package identity is independently
          # bound to source_commit below, including the exact module bytes.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: WhiteNightShadow/frx-director-mcp
          ref: ${{ inputs.mcp_commit }}
          path: mcp-fixture
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build pinned MCP transport
        working-directory: mcp-fixture
        run: npm ci
      - working-directory: mcp-fixture
        run: npm run build
      - name: Download candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$PACKAGE_TARGET" in
            windows*) ext=zip ;;
            macos*) ext=dmg ;;
            linux*) ext=tar.xz ;;
          esac
          gh release download "$RELEASE_TAG" --pattern "firefox-reverse-${RELEASE_TAG}-${PACKAGE_TARGET}.${ext}" --dir candidate
      - name: Verify package identity and extract
        run: python scripts/prepare-native-candidate.py
      - name: Native fingerprint and Unicode profile checks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-native-fingerprint.mjs --firefox "$FRX_TEST_BINARY" --xul-sha256 "$FRX_TEST_XUL_SHA" --mcp-root "$GITHUB_WORKSPACE/mcp-fixture" --allow-unavailable-webgl --context-type tab --report-output native-report/FINGERPRINT-REPORT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.target }}-report
          path: native-report/
          if-no-files-found: error

  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 下载候选包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9][0-9A-Za-z.-]*$') { throw 'Invalid release tag' }
          gh release download $env:RELEASE_TAG --pattern "firefox-reverse-$($env:RELEASE_TAG)-windows-x86_64.zip" --dir candidate
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
      - name: 原生启动、截图与 Ledger 验证
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_BUILD_ID: ${{ inputs.build_id }}
        run: python scripts/verify-windows-package.py
      - name: 保存验证报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-report
          path: native-report/
          if-no-files-found: error
